# Source of truth for Jambul.xcodeproj. After editing, run: xcodegen generate
name: Jambul
options:
  bundleIdPrefix: com.debikurnia
  deploymentTarget:
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Jambul:
    type: application
    platform: macOS
    sources:
      - path: Jambul
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.debikurnia.Jambul
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "6"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Jambul
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
      configs:
        # Needed for notarization. Off in Debug: with ad-hoc signing it would stop the test bundle from loading.
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - JambulTests
  JambulTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: JambulTests
        type: syncedFolder
    dependencies:
      - target: Jambul
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.debikurnia.JambulTests
